<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Jarvis Posture Platform{% endblock %}</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="/" class="brand">
        <span class="brand-mark" aria-hidden="true">JP</span>
        <span>Jarvis Posture Copilot</span>
        <span class="badge badge-neutral mono">127.0.0.1</span>
      </a>
      <nav class="nav-links" aria-label="Primary navigation">
        <a href="/" {% if active_page == "dashboard" %}aria-current="page"{% endif %}>Dashboard</a>
        <a href="/history" {% if active_page == "history" %}aria-current="page"{% endif %}>History</a>
        <a href="/settings" {% if active_page == "settings" %}aria-current="page"{% endif %}>Settings</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <span>Jarvis Posture Platform v{{ version }} · Local-first Arch Linux + Hyprland Control Plane</span>
  </footer>
</body>
</html>
