{% extends "base.html" %}

{% block title %}History · Jarvis Posture Platform{% endblock %}

{% block content %}
<div class="page-header">
  <h1>Activity, Timer &amp; Recommendation History</h1>
  <span class="muted">Local date {{ today_date }} · Auto-refreshing every 3s</span>
</div>

<div id="history-panel"
     hx-get="/partials/history"
     hx-trigger="every 3s"
     hx-swap="innerHTML">
  {% include "_partials/history_content.html" %}
</div>
{% endblock %}
