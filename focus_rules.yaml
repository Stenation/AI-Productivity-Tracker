# ==============================================================================
# Jarvis Tier-1 Window Focus Rules
# Easily customizable and replaceable rules for window and application classification.
# Categories: focused | neutral | distracted
# ==============================================================================

# Productive desktop application classes
# Categorized automatically as 'focused'
work_app_classes:
