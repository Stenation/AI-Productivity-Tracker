  - "antigravity-ide"
  - "code"
  - "cursor"
  - "vscodium"
  - "pycharm"
  - "idea"
  - "clion"
  - "webstorm"
  - "rubymine"
  - "goland"
  - "rustrover"
  - "datagrip"
  - "zed"
  - "neovim"
  - "nvim"
  - "emacs"
  - "sublime_text"
  - "sublime_merge"
  - "helix"
  - "kate"
  - "gedit"

  # --- Terminals & CLI Environments ---
  - "kitty"
  - "Alacritty"
  - "alacritty"
  - "wezterm"
  - "ghostty"
  - "foot"
  - "konsole"
  - "gnome-terminal"
  - "xfce4-terminal"
  - "terminator"
  - "xterm"

  # --- Bachelor Thesis, Academic Research, Notes & Scientific Writing ---
  - "sioyek"          # Research paper PDF viewer
  - "zotero"          # Reference & citation management
  - "Zotero"
  - "obsidian"        # Knowledge base & thesis notes
  - "logseq"
  - "mendeleydesktop" # Reference manager
  - "mendeley"
  - "jabref"          # BibTeX reference editor
  - "texstudio"       # LaTeX IDE
  - "kile"            # LaTeX editor
  - "texmaker"        # LaTeX editor
  - "lyx"             # Document processor
  - "gummi"           # Live LaTeX editor
  - "zettlr"          # Academic markdown editor
  - "anytype"
  - "joplin"
  - "anki"            # Flashcard study
  - "okular"          # Document & PDF viewer
  - "evince"          # PDF viewer
  - "zathura"         # Minimalist document viewer
  - "calibre"         # E-book / PDF library
  - "rstudio"         # Statistical analysis

  # --- Diagrams, Schematics & Whiteboards ---
  - "draw.io"
  - "drawio"
  - "inkscape"
  - "xournalpp"       # Note annotation
  - "rnote"           # Sketching & math notes

# Distraction desktop application classes
# Categorized automatically as 'distracted'
distraction_app_classes:
  - "steam"
  - "lutris"
  - "heroic"
  - "spotify"
  - "netflix"

