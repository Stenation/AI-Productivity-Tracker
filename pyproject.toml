[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis"
version = "0.1.0"
description = "Local-first, modular posture, focus, and calendar copilot for Arch Linux + Hyprland"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.32,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "pyyaml>=6.0.2,<7.0",
    "jinja2>=3.1.4,<4.0",
    "python-multipart>=0.0.18,<1.0",
    "aiosqlite>=0.20,<1.0",
]

[project.scripts]
jarvis = "jarvis.main:main"
jarvis-ptt = "jarvis.workers.ptt_voice:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<2.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.8,<1.0",
]
calendar = [
    "google-api-python-client>=2.150,<3.0",
    "google-auth-oauthlib>=1.2,<2.0",
    "google-auth-httplib2>=0.2,<1.0",
]
llm = [
    "ollama>=0.6,<1.0",
]
voice = [
    "faster-whisper>=1.1,<2.0",
    "piper-tts>=1.2,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

